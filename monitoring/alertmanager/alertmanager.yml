global:
  resolve_timeout: 1m
route:
  receiver: local-incidents
  group_by: [alertname, instance, topic]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1m
receivers:
  - name: local-incidents
    webhook_configs:
      - url: http://host.docker.internal:8002/alerts
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials: local-observability
