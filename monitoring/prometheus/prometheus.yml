global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alert_rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: ingestor
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: quality
    static_configs:
      - targets: [host.docker.internal:8001]
  - job_name: observability
    static_configs:
      - targets: [host.docker.internal:8002]
