{
  "rule_files": [
    "alert_rules.yml"
  ],
  "evaluation_interval": "5s",
  "tests": [
    {
      "name": "lag",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_consumer_lag_records{topic=\"raw\",partition=\"0\"}",
          "values": "0 200x10 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20s",
          "alertname": "ConsumerLagHigh",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "ConsumerLagHigh",
          "exp_alerts": [
            {
              "exp_labels": {
                "topic": "raw",
                "severity": "HIGH",
                "component": "consumer"
              },
              "exp_annotations": {
                "summary": "Consumer backlog above 100 records for 30 seconds"
              }
            }
          ]
        },
        {
          "eval_time": "100s",
          "alertname": "ConsumerLagHigh",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "checksum",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_archive_corrupted_files",
          "values": "0 1x4 0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0s",
          "alertname": "ArchiveChecksumMismatch",
          "exp_alerts": []
        },
        {
          "eval_time": "10s",
          "alertname": "ArchiveChecksumMismatch",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "CRITICAL",
                "component": "archive"
              },
              "exp_annotations": {
                "summary": "Registered archive integrity verification failed"
              }
            }
          ]
        },
        {
          "eval_time": "40s",
          "alertname": "ArchiveChecksumMismatch",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "database",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_database_errors_total{operation=\"quality_transaction\"}",
          "values": "0+1x10 10x60"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0s",
          "alertname": "DatabaseErrors",
          "exp_alerts": []
        },
        {
          "eval_time": "20s",
          "alertname": "DatabaseErrors",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "HIGH",
                "component": "database"
              },
              "exp_annotations": {
                "summary": "Database operation failures observed"
              }
            }
          ]
        },
        {
          "eval_time": "4m",
          "alertname": "DatabaseErrors",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "rejection",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_consumer_throughput_total{status=\"quarantined\"}",
          "values": "0+1x40 40x100"
        },
        {
          "series": "wikimedia_consumer_throughput_total{status=\"accepted\"}",
          "values": "0+9x40 360x100"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20s",
          "alertname": "QualityRejectionRate",
          "exp_alerts": []
        },
        {
          "eval_time": "80s",
          "alertname": "QualityRejectionRate",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "MEDIUM",
                "component": "quality"
              },
              "exp_annotations": {
                "summary": "Quarantined delivery rate exceeds five percent"
              }
            }
          ]
        },
        {
          "eval_time": "8m",
          "alertname": "QualityRejectionRate",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "delay",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_ingestion_delay_seconds_bucket{le=\"300\"}",
          "values": "0x150"
        },
        {
          "series": "wikimedia_ingestion_delay_seconds_bucket{le=\"1800\"}",
          "values": "0+10x40 400x110"
        },
        {
          "series": "wikimedia_ingestion_delay_seconds_bucket{le=\"+Inf\"}",
          "values": "0+10x40 400x110"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20s",
          "alertname": "IngestionDelayHigh",
          "exp_alerts": []
        },
        {
          "eval_time": "80s",
          "alertname": "IngestionDelayHigh",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "MEDIUM",
                "component": "ingestion"
              },
              "exp_annotations": {
                "summary": "Receipt-to-source delay p95 exceeds 300 seconds"
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "IngestionDelayHigh",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "target",
      "interval": "5s",
      "input_series": [
        {
          "series": "up{job=\"quality\",instance=\"test:8001\"}",
          "values": "0x10 1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20s",
          "alertname": "PipelineTargetDown",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "PipelineTargetDown",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "HIGH",
                "component": "monitoring",
                "job": "quality",
                "instance": "test:8001"
              },
              "exp_annotations": {
                "summary": "Configured pipeline metrics target is unavailable"
              }
            }
          ]
        },
        {
          "eval_time": "100s",
          "alertname": "PipelineTargetDown",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "probe",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_observability_probe_success{component=\"kafka\"}",
          "values": "0x10 1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "5s",
          "alertname": "ObservabilityProbeFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "20s",
          "alertname": "ObservabilityProbeFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "HIGH",
                "component": "monitoring"
              },
              "exp_annotations": {
                "summary": "Background state probe is failing; gauges may be stale"
              }
            }
          ]
        },
        {
          "eval_time": "100s",
          "alertname": "ObservabilityProbeFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "sse",
      "interval": "5s",
      "input_series": [
        {
          "series": "wikimedia_ingest_connection_state{endpoint=\"recentchange\"}",
          "values": "0x10 1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20s",
          "alertname": "SSEDisconnected",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "SSEDisconnected",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "MEDIUM",
                "component": "ingestion",
                "endpoint": "recentchange"
              },
              "exp_annotations": {
                "summary": "SSE connection disconnected for 30 seconds"
              }
            }
          ]
        },
        {
          "eval_time": "100s",
          "alertname": "SSEDisconnected",
          "exp_alerts": []
        }
      ]
    }
  ]
}
