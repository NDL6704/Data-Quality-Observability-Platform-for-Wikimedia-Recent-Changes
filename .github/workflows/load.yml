name: controlled-load
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/verify_sustained.py
      - .github/workflows/load.yml
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: wikimedia-load-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare bounded load environment
        run: |
          python -m pip install -e '.[dev,dashboard]'
          cp .env.example .env
          mkdir -p data/sustained_runs
      - run: docker compose up -d --wait --wait-timeout 180 kafka postgres
      - run: python -m src.storage.migration_runner
      - name: Offer 20000 deliveries at 100 per second and reconcile
        run: python -m scripts.verify_sustained --mode synthetic --count 20000 --rate 100 --seconds 240 --drain 120
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p data/sustained_runs
          docker compose ps -a > data/sustained_runs/services.txt 2>&1
          docker compose logs --no-color > data/sustained_runs/compose.log 2>&1
          docker stats --no-stream > data/sustained_runs/container-stats.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-load-evidence
          path: data/sustained_runs/
          if-no-files-found: error
      - if: always()
        run: docker compose down --volumes --remove-orphans
