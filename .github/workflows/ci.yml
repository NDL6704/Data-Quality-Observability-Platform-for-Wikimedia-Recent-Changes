name: quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,dashboard]'
      - run: ruff check .
      - run: mypy .
      - name: Offline unit and contract tests
        run: pytest tests/unit tests/contract -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore

  integration:
    name: Kafka and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: wikimedia-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and prepare isolated CI configuration
        run: |
          python -m pip install -e '.[dev,dashboard]'
          cp .env.example .env
          mkdir -p ci-evidence
      - name: Start real Kafka and PostgreSQL and wait for readiness
        run: docker compose up -d --wait --wait-timeout 180 kafka postgres
      - name: Apply database migrations
        run: python -m src.storage.migration_runner
      - name: Verify routing, deduplication, acknowledgment and recovery
        run: |
          pytest -v -ra \
            tests/integration/test_db_migration.py \
            tests/integration/test_kafka_broker.py \
            tests/integration/test_repository.py \
            tests/integration/test_consumer.py \
            tests/recovery/test_recovery_storage.py \
            --junitxml=ci-evidence/integration-results.xml
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose ps -a > ci-evidence/services.txt 2>&1
          docker compose logs --no-color > ci-evidence/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: ci-evidence/
          if-no-files-found: error
      - name: Remove ephemeral CI services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
