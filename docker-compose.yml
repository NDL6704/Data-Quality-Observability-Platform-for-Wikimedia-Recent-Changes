services:
  quality-consumer:
    profiles: [runtime]
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [wikimedia-net]

  postgres:
    image: postgres:16-alpine
    container_name: wikimedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wikimedia_dq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wikimedia_dq}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - wikimedia-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: wikimedia-kafka
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - wikimedia-net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: wikimedia-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [wikimedia-net]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: wikimedia-alertmanager
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--cluster.listen-address="]
    ports: ["127.0.0.1:9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks: [wikimedia-net]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: wikimedia-grafana
    profiles: [monitoring]
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [wikimedia-net]

  airflow-db:
    image: postgres:16-alpine
    profiles: [airflow]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-local
      POSTGRES_DB: airflow
    volumes: ["airflow_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wikimedia-net]

  airflow-init:
    &airflow-common
    build: {context: ., dockerfile: docker/airflow/Dockerfile}
    image: wikimedia-airflow:2.10.5
    profiles: [airflow]
    environment:
      &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-local@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/dags
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-wikimedia-airflow-development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-wikimedia_dq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RAW_ARCHIVE_DIR: /workspace/data/raw_archive
    volumes:
      - ./src:/workspace/src:ro
      - ./schemas:/workspace/schemas:ro
      - ./dags:/workspace/dags:ro
      - ./data/raw_archive:/workspace/data/raw_archive
      - ./scripts:/workspace/scripts:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-db: {condition: service_healthy}
      postgres: {condition: service_healthy}
    command: ["bash", "-c", "airflow db migrate && (airflow users list | grep -q 'local-admin' || airflow users create --username local-admin --password local-airflow --firstname Local --lastname Admin --role Admin --email local@example.invalid)"]
    networks: [wikimedia-net]

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: scheduler

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: webserver
    ports: ["127.0.0.1:8080:8080"]

volumes:
  airflow_db_data:
  airflow_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  postgres_data:
    name: wikimedia_postgres_data
  kafka_data:
    name: wikimedia_kafka_data

networks:
  wikimedia-net:
    name: wikimedia-network
    driver: bridge
