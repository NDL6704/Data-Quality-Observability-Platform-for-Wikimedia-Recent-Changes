[project]
name = "wikimedia-dq-platform"
version = "0.1.0"
description = "Production-Style Data Quality & Observability Platform for Wikimedia Recent Changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2,<4",
    "confluent-kafka>=2.4.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "pyarrow>=16.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
dashboard = [
    "streamlit>=1.49.1,<2",
    "plotly>=6.3.0,<7",
    "psycopg-pool>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "schemas", "dashboards", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/phase7_packaging"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["dags/", "data/phase7_packaging/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: mark test as integration test with external brokers or db",
]
